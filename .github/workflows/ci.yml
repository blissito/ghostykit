name: CI

# Pruebas del reductor y del transporte, tipos, build del paquete y de la demo en cada push y PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo
        run: npm run build -w ghosty-autopilot-demo
